name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify (Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Setup pinned toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm run check
          npm run smoke:start
          npm run release:package
          npm run release:verify

  local-contract-changes:
    name: Detect local contract changes
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.paths.outputs.needed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect relevant paths
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          needed=$(printf '%s\n' "$changed_files" | node dev/local-chain/scripts/ci-local-contracts-needed.mjs)
          printf 'needed=%s\n' "$needed" >> "$GITHUB_OUTPUT"
          printf 'Local contract harness needed: %s\n' "$needed"

  local-contracts:
    needs: local-contract-changes
    if: needs.local-contract-changes.outputs.needed == 'true'
    name: Local contract harness
    runs-on: ubuntu-24.04
    env:
      ITX_LOCAL_RPC_PORT: 18545

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Setup pinned toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install application dependencies
        run: npm ci

      - name: Ensure Playwright browser
        shell: bash
        run: |
          set -euo pipefail
          browser_path=$(npx playwright install --dry-run chromium | awk '/Install location:/ { print $3; exit }')
          if [[ ! -d "$browser_path" ]]; then
            npx playwright install chromium
          fi

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Verify local contract harness
        run: npm run test:contracts:local

      - name: Verify local Anvil workflow
        run: |
          npm run local:anvil
          npm run local:seed -- commit-open
          npm run local:smoke
          npm run test:phases:local
          npm run test:local-scenarios
          npm run local:seed -- commit-open
          npm run local:stage-boundaries
          npm run test:e2e:local
          npm run local:reset

      - name: Stop local Anvil
        if: always()
        run: npm run local:down
