name: Setup pinned toolchain
description: Installs the pinned Node major and the exact npm version declared in package.json, then verifies both.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 24
        cache: npm

    # The runner image ships whichever npm its Node build bundles, so the pin has to be installed
    # before it is asserted. package.json is the single source of that pin.
    - name: Install pinned npm
      shell: bash
      run: npm i -g "npm@$(node -p 'require("./package.json").engines.npm')"

    - name: Verify toolchain
      shell: bash
      run: node -e "const {execFileSync}=require('node:child_process'); const pinned=require('./package.json').engines.npm; if (!/^\d+\.\d+\.\d+$/.test(pinned ?? '')) throw new Error('package.json engines.npm must pin an exact npm version.'); const npm=execFileSync('npm',['--version'],{encoding:'utf8'}).trim(); const major=Number(process.versions.node.split('.')[0]); if (major !== 24 || npm !== pinned) throw new Error('Expected Node 24 and npm ' + pinned + ', found ' + process.version + ' and npm ' + npm); console.log(process.version, npm);"
